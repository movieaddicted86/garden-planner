services:
  garden-planner:
    build:
      context: .
    image: garden-planner:latest
    container_name: garden-planner
    restart: unless-stopped
    ports:
      # host port 8090: 8080 is taken by WebSlicer on the development machine
      - '8090:8080'
    volumes:
      # projects as JSON files
      - garden-planner-data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data

volumes:
  garden-planner-data:
